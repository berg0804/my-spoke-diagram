<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spoke Diagram</title>
  <script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
  <style>
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
    }
    #controls {
      padding: 1em;
      background: #222;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    #cy {
      width: 100%;
      height: 88vh;
      border-top: 1px solid #333;
    }
    select, input {
      padding: 6px;
      font-size: 16px;
      border-radius: 4px;
      border: none;
      margin: 0.5em;
    }
  </style>
</head>
<body>
  <div id="controls">
    <input type="text" id="searchBox" placeholder="Search for a player..." />
    <select id="results"></select>
    <button id="showBtn">Show Diagram</button>
  </div>
  <div id="cy"></div>

  <script>
    let graphData = {};
    let cy;

    // Load JSON from GitHub Pages
    fetch('player_graph.json')
      .then(response => response.json())
      .then(graph => {
        graphData = graph;

        // Build a list of all nodes (both keys and targets)
        const allNodes = new Set();
        Object.keys(graph).forEach(src => {
          allNodes.add(src);
          graph[src].forEach(tgt => allNodes.add(tgt));
        });

        const allNodesArray = Array.from(allNodes).sort();
        const results = document.getElementById('results');
        results.innerHTML = '<option value="">Select a player</option>';
        allNodesArray.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          results.appendChild(opt);
        });

        // Filter dropdown based on search box input
        const searchBox = document.getElementById('searchBox');
        searchBox.addEventListener('input', () => {
          const query = searchBox.value.toLowerCase();
          results.innerHTML = '<option value="">Select a player</option>';
          allNodesArray
            .filter(n => n.toLowerCase().includes(query))
            .forEach(n => {
              const opt = document.createElement('option');
              opt.value = n;
              opt.textContent = n;
              results.appendChild(opt);
            });
        });
      })
      .catch(err => console.error('Error loading JSON:', err));

    // Button click builds the diagram
    document.getElementById('showBtn').addEventListener('click', () => {
      const selected = document.getElementById('results').value;
      if (!selected) {
        alert('Please select a player first.');
        return;
      }

      // Build elements from selected node
      const elements = [];
      elements.push({ data: { id: selected, label: selected } });

      const neighbors = graphData[selected] || [];
      neighbors.forEach(target => {
        elements.push({ data: { id: target, label: target } });
        elements.push({ data: { source: selected, target: target } });
      });

      // Create Cytoscape instance (or clear if it exists)
      if (cy) cy.destroy();
      cy = cytoscape({
        container: document.getElementById('cy'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': ele => (ele.data('id') === selected ? 'orange' : '#6fa8dc'),
              'label': 'data(label)',
              'color': 'white',
              'font-size': 12,
              'text-valign': 'center'
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 2,
              'line-color': '#ccc',
              'target-arrow-color': '#ccc',
              'target-arrow-shape': 'triangle'
            }
          }
        ],
        layout: { name: 'cose', animate: true }
      });

      // Click node to expand its connections dynamically
      cy.on('tap', 'node', evt => {
        const nodeId = evt.target.id();
        const newNeighbors = graphData[nodeId] || [];
        newNeighbors.forEach(target => {
          if (cy.getElementById(target).empty()) {
            cy.add([
              { data: { id: target, label: target } },
              { data: { source: nodeId, target: target } }
            ]);
          }
        });
        cy.layout({ name: 'cose', animate: true }).run();
      });
    });
  </script>
</body>
</html>
