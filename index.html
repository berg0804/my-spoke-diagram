<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spoke Diagram</title>
<script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
<style>
  body {
    background-color: #111;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #controls {
    background: #222;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  select {
    background: #333;
    color: white;
    border: none;
    padding: 6px;
    border-radius: 4px;
    width: 200px;
  }
  #cy {
    flex-grow: 1;
    width: 100%;
    height: 100%;
  }
  button {
    background: #444;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="controls">
    <div>
      From: <select id="startNode"></select>
      To: <select id="endNode"></select>
      <button id="findPath">Find Shortest Path</button>
    </div>
  </div>

  <div id="cy"></div>

<script>
// Load both graph and colors JSONs
Promise.all([
  fetch('player_graph.json').then(r => r.json()),
  fetch('colors.json').then(r => r.json())
]).then(([graph, colors]) => {

  // --- Step 1: Sanitize node names (replace spaces with underscores for internal IDs) ---
  const sanitize = name => name.replace(/\s+/g, '_');

  const elements = [];
  const nodeSet = new Set();

  // --- Step 2: Build Cytoscape elements from JSON ---
  for (const source in graph) {
    const sourceId = sanitize(source);
    nodeSet.add(sourceId);
    elements.push({
      data: { id: sourceId, label: source },
      style: { 'background-color': colors[source] || '#6fa8dc' }
    });
    for (const target of graph[source]) {
      const targetId = sanitize(target);
      if (!nodeSet.has(targetId)) {
        elements.push({
          data: { id: targetId, label: target },
          style: { 'background-color': colors[target] || '#6fa8dc' }
        });
        nodeSet.add(targetId);
      }
      elements.push({ data: { source: sourceId, target: targetId } });
    }
  }

  // --- Step 3: Initialize Cytoscape ---
  const cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    layout: { name: 'cose', animate: true },
    style: [
      {
        selector: 'node',
        style: {
          'label': 'data(label)',
          'color': 'white',
          'text-valign': 'center',
          'text-outline-color': '#222',
          'text-outline-width': 2,
          'font-size': 12,
          'width': 20,
          'height': 20
        }
      },
      { selector: 'edge', style: { 'width': 2, 'line-color': '#888' } }
    ]
  });

  // --- Step 4: Dropdowns ---
  const allNodes = Array.from(nodeSet).sort();
  const startDropdown = document.getElementById('startNode');
  const endDropdown = document.getElementById('endNode');

  allNodes.forEach(id => {
    const label = cy.$id(id).data('label');
    const opt1 = document.createElement('option');
    const opt2 = document.createElement('option');
    opt1.value = opt2.value = id;
    opt1.textContent = opt2.textContent = label;
    startDropdown.appendChild(opt1);
    endDropdown.appendChild(opt2);
  });

  // --- Step 5: Highlight selected node from dropdown ---
  startDropdown.addEventListener('change', () => {
    cy.elements().removeClass('selectedNode');
    cy.nodes().forEach(n => {
      n.style('width', 20);
      n.style('height', 20);
    });
    const selected = cy.$id(startDropdown.value);
    selected.style('width', 40);
    selected.style('height', 40);
  });

  // --- Step 6: Shortest path ---
  document.getElementById('findPath').addEventListener('click', () => {
    const start = cy.$id(startDropdown.value);
    const end = cy.$id(endDropdown.value);
    if (!start.nonempty() || !end.nonempty()) return;

    const dijkstra = cy.elements().dijkstra({ root: start, directed: true });
    const path = dijkstra.pathTo(end);

    cy.elements().removeClass('highlighted');
    cy.elements().style('line-color', '#888');
    cy.elements().style('background-color', ele => colors[ele.data('label')] || '#6fa8dc');
    path.addClass('highlighted');
  });

  cy.style().selector('.highlighted').style({
    'background-color': '#ff9800',
    'line-color': '#ff9800',
    'width': 5,
    'height': 5
  }).update();
});
</script>
</body>
</html>
