<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spoke Diagram</title>
<script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
<style>
  body {
    background-color: #111;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #controls {
    background: #222;
    padding: 10px;
    display: flex;
    align-items: center;
  }
  select {
    background: #333;
    color: white;
    border: none;
    padding: 6px;
    border-radius: 4px;
    width: 250px;
  }
  #cy {
    flex-grow: 1;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div id="controls">
    <label for="nodeSelect">Select a player:</label>
    <select id="nodeSelect"></select>
  </div>

  <div id="cy"></div>

<script>
Promise.all([
  fetch('player_graph.json').then(r => r.json()),
  fetch('colors.json').then(r => r.json())
]).then(([graph, colors]) => {

  const sanitize = name => name.replace(/\s+/g, '_');
  const elements = [];
  const nodeSet = new Set();

  // Build Cytoscape elements
  for (const source in graph) {
    const sourceId = sanitize(source);
    nodeSet.add(sourceId);
    elements.push({
      data: { id: sourceId, label: source },
      style: { 'background-color': colors[source] || '#6fa8dc' }
    });

    for (const target of graph[source]) {
      const targetId = sanitize(target);
      if (!nodeSet.has(targetId)) {
        elements.push({
          data: { id: targetId, label: target },
          style: { 'background-color': colors[target] || '#6fa8dc' }
        });
        nodeSet.add(targetId);
      }
      elements.push({ data: { source: sourceId, target: targetId } });
    }
  }

  // Initialize Cytoscape
  const cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    layout: { name: 'cose', animate: true },
    style: [
      {
        selector: 'node',
        style: {
          'label': 'data(label)',
          'color': 'white',
          'text-valign': 'center',
          'text-outline-color': '#222',
          'text-outline-width': 2,
          'font-size': 12,
          'width': 20,
          'height': 20
        }
      },
      { selector: 'edge', style: { 'width': 2, 'line-color': '#888' } }
    ]
  });

  // Populate dropdown
  const allNodes = Array.from(nodeSet).sort();
  const dropdown = document.getElementById('nodeSelect');
  allNodes.forEach(id => {
    const label = cy.$id(id).data('label');
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = label;
    dropdown.appendChild(opt);
  });

  // Update when dropdown changes
  dropdown.addEventListener('change', () => {
    cy.elements().removeClass('faded');
    const selected = cy.$id(dropdown.value);

    cy.nodes().forEach(n => {
      n.style('width', 20);
      n.style('height', 20);
    });
    selected.style('width', 40);
    selected.style('height', 40);

    const neighborhood = selected.closedNeighborhood();
    cy.elements().addClass('faded');
    neighborhood.removeClass('faded');
    cy.animate({
      fit: { eles: neighborhood, padding: 80 },
      duration: 500
    });
  });

  // Expand on click
  cy.on('tap', 'node', evt => {
    const node = evt.target;
    const nodeId = node.id();
    const label = node.data('label');

    if (graph[label]) {
      const existingTargets = new Set(cy.edges().map(e => e.data('target')));
      for (const target of graph[label]) {
        const targetId = sanitize(target);
        if (!cy.$id(targetId).nonempty()) {
          cy.add({
            data: {
              id: targetId,
              label: target
            },
            style: {
              'background-color': colors[target] || '#6fa8dc'
            }
          });
        }
        if (!existingTargets.has(targetId)) {
          cy.add({ data: { source: nodeId, target: targetId } });
        }
      }
      cy.layout({ name: 'cose', animate: true }).run();
    }
  });
});
</script>
</body>
</html>
