<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spoke Diagram</title>
  <script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
  <style>
    body { background: #111; color: white; font-family: sans-serif; }
    #cy { width: 100%; height: 90vh; border: 1px solid #333; }
  </style>
</head>
<body>
  <h2>Spoke Diagram</h2>
  <div id="cy"></div>

  <script>
    // Load JSON dynamically
    fetch('player_graph.json')
      .then(response => response.json())
      .then(graph => {
        // Convert your JSON into Cytoscape elements
        const elements = [];
        Object.keys(graph).forEach(source => {
          elements.push({ data: { id: source, label: source } });
          graph[source].forEach(target => {
            elements.push({ data: { id: target, label: target } });
            elements.push({ data: { source: source, target: target } });
          });
        });

        const cy = cytoscape({
          container: document.getElementById('cy'),
          elements: elements,
          style: [
            {
              selector: 'node',
              style: {
                'background-color': '#6fa8dc',
                'label': 'data(label)',
                'color': 'white',
                'font-size': 12,
                'text-valign': 'center'
              }
            },
            {
              selector: 'edge',
              style: {
                'width': 2,
                'line-color': '#ccc',
                'target-arrow-color': '#ccc',
                'target-arrow-shape': 'triangle'
              }
            }
          ],
          layout: {
            name: 'cose',
            animate: true
          }
        });

        // Click node to expand
        cy.on('tap', 'node', evt => {
          const node = evt.target;
          const nodeId = node.id();

          const neighbors = graph[nodeId];
          if (neighbors && neighbors.length > 0) {
            neighbors.forEach(target => {
              // Only add if it doesn’t exist
              if (cy.getElementById(target).empty()) {
                cy.add([
                  { data: { id: target, label: target } },
                  { data: { source: nodeId, target: target } }
                ]);
              }
            });
            cy.layout({ name: 'cose', animate: true }).run();
          }
        });
      })
      .catch(err => console.error('Error loading JSON:', err));
  </script>
</body>
</html>
